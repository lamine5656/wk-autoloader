<!doctype html>
<html lang="fr">

<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>L92 WebKit Autoloader</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      -webkit-box-sizing: border-box;
      box-sizing: border-box;
    }

    html,
    body {
      height: 100%;
    }

    body {
      font-family: -apple-system, "Segoe UI", Roboto, "Helvetica Neue", Helvetica, Arial, sans-serif;
      background: #04060e;
      color: #e6f1ff;
      display: -webkit-box;
      display: -webkit-flex;
      display: flex;
      -webkit-box-align: center;
      -webkit-align-items: center;
      align-items: center;
      -webkit-box-pack: center;
      -webkit-justify-content: center;
      justify-content: center;
      min-height: 100%;
      text-align: center;
      overflow: hidden;
    }

    #bg {
      position: fixed;
      top: 0; right: 0; bottom: 0; left: 0;
      z-index: 0;
      background: -webkit-radial-gradient(ellipse at 50% 40%, rgba(15, 26, 53, 0.55), rgba(4, 6, 14, 1));
      background: radial-gradient(ellipse at 50% 40%, rgba(15, 26, 53, 0.55), rgba(4, 6, 14, 1));
      pointer-events: none;
    }

    main {
      position: relative;
      z-index: 1;
      padding: 2rem;
    }

    .logo {
      width: 5.5rem;
      height: 5.5rem;
      margin-bottom: 1.25rem;
      -webkit-filter: drop-shadow(0 0 22px rgba(34, 211, 238, 0.5));
      filter: drop-shadow(0 0 22px rgba(34, 211, 238, 0.5));
    }

    p {
      font-size: 1.3rem;
      line-height: 1.5;
      color: #9fb6d4;
    }

    p.bad {
      color: #f87171;
    }
  </style>
</head>

<body>
  <div id="bg"></div>

  <main>
    <img class="logo" src="/logo.svg" alt="L92" />
    <p id="status">Chargement…</p>
  </main>

  <script>
    (function () {
      'use strict';

      var dir = '[[APP_DIR_PLACEHOLDER]]';
      var version = '[[VERSION_PLACEHOLDER]]';
      var statusEl = document.getElementById('status');

      function fail() {
        statusEl.textContent = 'Cache incomplet — relance l\'installateur.';
        statusEl.className = 'bad';
      }

      /* __complete__ est la DERNIÈRE entrée du manifeste AppCache : si elle est
         présente (avec le contenu de notre version), tous les fichiers avant
         elle ont été téléchargés. Ce n'est qu'alors qu'on pointe vers l'app.
         Si le marqueur manque, ce fetch retombe sur cette page (contenu
         différent) ou échoue — on ne redirige jamais vers un répertoire
         partiellement mis en cache. */
      fetch('/app/' + dir + '/__complete__')
        .then(function (r) {
          return r.text();
        })
        .then(function (t) {
          if (t.trim() === version) {
            window.location.replace('/app/' + dir + '/index.html');
          } else {
            fail();
          }
        })
        .catch(fail);
    })();
  </script>
</body>

</html>
