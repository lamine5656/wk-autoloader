<!doctype html>
<html lang="fr">

<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>L92 WebKit Autoloader</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      -webkit-box-sizing: border-box;
      box-sizing: border-box;
    }

    html,
    body {
      height: 100%;
    }

    body {
      font-family: -apple-system, "Helvetica Neue", Helvetica, Arial, sans-serif;
      background: #04060e;
      background: -webkit-linear-gradient(180deg, #070b18 0%, #04060e 100%);
      background: linear-gradient(180deg, #070b18 0%, #04060e 100%);
      color: #e6f1ff;
      display: -webkit-box;
      display: -webkit-flex;
      display: flex;
      -webkit-box-align: center;
      -webkit-align-items: center;
      align-items: center;
      -webkit-box-pack: center;
      -webkit-justify-content: center;
      justify-content: center;
      min-height: 100%;
      text-align: center;
    }

    p {
      font-size: 1.375rem;
      line-height: 1.5;
      color: #8ea3c0;
    }

    p.bad {
      color: #f87171;
      text-shadow: 0 0 14px rgba(239, 68, 68, 0.4);
    }

    p.ok {
      color: #22d3ee;
      text-shadow: 0 0 14px rgba(34, 211, 238, 0.4);
    }
  </style>
</head>

<body>
  <main>
    <p id="status">Chargement&hellip;</p>
  </main>

  <script>
    (function () {
      'use strict';

      var dir = '[[APP_DIR_PLACEHOLDER]]';
      var version = '[[VERSION_PLACEHOLDER]]';
      var statusEl = document.getElementById('status');

      function fail() {
        statusEl.textContent = 'Cache incomplet — relancez l\'installateur.';
        statusEl.className = 'bad';
      }

      /* __complete__ is the LAST entry of the AppCache manifest, so if it is
         present (with our version content) every file before it was downloaded.
         Only then point at the app. If the marker is missing, this fetch falls
         back to this very page (content mismatch) or errors - never redirect
         into a partially cached directory. */
      fetch('/app/' + dir + '/__complete__')
        .then(function (r) {
          return r.text();
        })
        .then(function (t) {
          if (t.trim() === version) {
            statusEl.textContent = 'Chargement de L92 WebKit Autoloader…';
            statusEl.className = 'ok';
            window.location.replace('/app/' + dir + '/index.html');
          } else {
            fail();
          }
        })
        .catch(fail);
    })();
  </script>
</body>

</html>
